[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "apix-backend"
version = "0.1.0"
description = "APIx acquisition and air-fare index backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
test = [
    "aiosqlite>=0.20,<1",
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]
live = [
    "playwright>=1.49,<2",
]
docs = [
    "python-pptx>=1.0,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "apix_index*"]

[tool.setuptools.package-data]
"app.sources.mock_fare" = ["fixtures/*.json"]
"app.sources.akasa" = ["fixtures/*.json"]
"app.sources.ota" = ["fixtures/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "E501"]
