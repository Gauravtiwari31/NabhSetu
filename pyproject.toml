[project]
name = "apix"
version = "1.0.0"
description = "APIx - Real-time Airfare Price Index for India"
requires-python = ">=3.9"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.12.0",
    "scikit-learn==1.4.2",
    "PyYAML==6.0.3",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.3",
    "httpx==0.28.1",
    "pytest==8.2.0"
]

[tool.vercel]
entrypoint = "src.apix_api.main:app"
