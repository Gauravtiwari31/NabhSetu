# Nabhsetu method configuration (the APIx index family).
# Every value here is stamped onto published index numbers as `method_version`.
method_version: "1.0.0"

# Advance-purchase windows (tau, days before departure). Part 4, product key.
apw_windows: [1, 7, 15, 30, 45]

# Elementary aggregate: minimum matched products before a cell is published.
# Below this the cell is suppressed and its weight redistributed pro-rata
# within the route (Part 4, Stage 1).
n_min: 5

# Outlier detection (Part 4, Stage 0c). Multiplier is 3, not 1.5: fares are
# legitimately dispersed and 1.5 would trim real observations.
tukey_k: 3.0
hampel_z: 3.5
jump_sigma: 3.0

# Day-of-week de-seasonalising: 7-day centred geometric moving average.
dow_window: 7

# Reference period. Null lets the engine pick the earliest BEST-COVERED period,
# which matters on the travel basis: the earliest departure date in a panel can
# only have been observed at the shortest advance-purchase window, so taking it
# as the base silently collapses the headline to a T+1 index.
# PIN THIS (e.g. "2026-08-01") once a series is published for real -- a base
# that moves as new data arrives rewrites history. NOTE: the pipeline runs BOTH
# bases, and a book period is a collection date while a travel period is a
# departure date, so one pinned value cannot serve both -- pin per basis, or
# the run that does not contain the date raises.
#
# This CANNOT be set to a 2024 date. See `linkage` below.
base_period: null

# ---------------------------------------------------------------- linkage
# Presenting the index on a 2024=100 footing.
#
# APIx cannot be BASED on 2024. The matched-model (Jevons) comparison prices
# product kappa at the base against kappa at period t; with no 2024 quotes
# there are no matches and there is no index. No 2024 fare quotes exist in
# this project and none can be back-collected -- a fare is a quote at a moment,
# not a fact retrievable later. Pinning base_period into 2024 raises.
#
# So the native series is CHAIN-LINKED onto MoSPI's CPI Transport division,
# which is itself published on base 2024=100:
#
#     APIx_2024(t) = APIx_native(t) * link_factor / 100
#
# THIS IS A SPLICE, NOT A MEASUREMENT. It asserts that airfare inflation from
# 2024 to the link period equalled Transport CPI inflation over the same span.
# That assumption is weak and must be reported, not buried:
#   - Transport is a DILUTED proxy. It carries road fuel, rail fares and
#     vehicle prices, all of which move for unrelated reasons. There is no
#     'passenger transport by air' item index in the MoSPI extracts at all
#     (see apix_reference/cpi.py).
#   - Airfares are far more volatile than the Transport aggregate: Transport
#     sat at 100.5-100.9 through early 2026, then stepped to 105.63 by July.
#   - CPI Transport stops at 2026-07 while the fare panel starts 2026-09, so
#     a two-month gap is bridged by assumption, not by data.
# The engine keeps the unlinked measurement as `value_native` on every period.
linkage:
  enabled: true
  base_year: 2024
  link_factor: 105.63
  link_period: "2026-07"
  source_file: "Datasets/cpi_96.csv"
  label: "2024=100, chain-linked via CPI Transport (All India, Combined), 2026-07"

# A headline period must rest on at least this share of omega to be published.
# Below it the number is not what its label claims: it is one or two windows
# standing in for the whole booking curve. Per-window sub-series are exempt --
# being a single window is their definition.
min_omega_covered: 0.60

# Uncertainty: flight-block bootstrap.
bootstrap_draws: 500
bootstrap_seed: 20260822
ci_level: 0.90

# Lead-time weights omega_tau. Three declared presets; the headline is published
# under all three and the spread is the sensitivity analysis (Part 4, Stage 4).
# THIS IS A POLICY PARAMETER, NOT A MEASUREMENT. The booking lead-time
# distribution for India is not public (DGCA asked in Dec 2024; FIA refused).
omega_presets:
  uniform:          {1: 0.20, 7: 0.20, 15: 0.20, 30: 0.20, 45: 0.20}
  leisure_tilted:   {1: 0.05, 7: 0.10, 15: 0.20, 30: 0.30, 45: 0.35}
  business_tilted:  {1: 0.30, 7: 0.30, 15: 0.20, 30: 0.15, 45: 0.05}
default_omega_preset: uniform

# Index variants (Part 4, section 2.1).
#   B = base fare + YQ/YR only        (pure airline pricing)
#   T = everything except OTA fee     (what a traveller pays -- HEADLINE)
#   A = T + OTA convenience fee       (all-in checkout cost)
variants: ["B", "T", "A"]
headline_variant: "T"
